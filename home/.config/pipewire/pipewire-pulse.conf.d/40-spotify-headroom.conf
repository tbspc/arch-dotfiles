# Spotify requests very small buffers; give only this client more headroom.
pulse.rules = [
    {
        matches = [ { application.process.binary = "spotify" } ]
        actions = {
            update-props = {
                pulse.min.req = 4096/48000
                pulse.min.quantum = 2048/48000
                pulse.default.tlength = 8192/48000
            }
        }
    }
]
