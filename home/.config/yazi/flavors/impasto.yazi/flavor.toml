# GENERATED by scripts/theme_manager.py on every palette change.
# Read by yazi as `[flavor] dark = "impasto"`; edits here are lost at
# the next theme switch, and yazi has to be reopened to see it.
#
# Backgrounds are set only where something has to sit on one, so the
# blurred desktop under the terminal comes through everywhere else.

[mgr]
cwd = { fg = "#CB813C", bold = true }

find_keyword = { fg = "#f9e2af", bold = true, underline = true }
find_position = { fg = "#5a5757", bold = true, italic = true }
symlink_target = { fg = "#b7c0cb", italic = true }

marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#835326", bg = "#835326" }
marker_selected = { fg = "#CB813C", bg = "#CB813C" }

count_copied = { fg = "#2c1c0d", bg = "#a6e3a1" }
count_cut = { fg = "#2c1c0d", bg = "#f38ba8" }
count_selected = { fg = "#11111b", bg = "#CB813C" }

border_symbol = "│"
border_style = { fg = "#3a3331" }

# The cursor, in both panes: the ground lifted, and towards the accent
# where the cursor actually is.
[indicator]
current = { bg = "#6b441f" }
parent = { bg = "#392a1d" }
preview = { underline = true }

[tabs]
active = { fg = "#eef2f7", bg = "#47392d", bold = true }
inactive = { fg = "#94a1b2", bg = "#392a1d" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#eef2f7", bg = "#47392d", bold = true }
normal_alt = { fg = "#94a1b2", bg = "#392a1d" }

select_main = { fg = "#11111b", bg = "#CB813C", bold = true }
select_alt = { fg = "#CB813C", bg = "#6b441f" }

unset_main = { fg = "#2c1c0d", bg = "#f9e2af", bold = true }
unset_alt = { fg = "#f9e2af", bg = "#7e6b4d" }

[status]
overall = { fg = "#eef2f7" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep = { fg = "#5a5757" }
perm_type = { fg = "#89b4fa" }
perm_read = { fg = "#f9e2af" }
perm_write = { fg = "#f38ba8" }
perm_exec = { fg = "#a6e3a1" }

progress_label = { fg = "#eef2f7", bold = true }
progress_normal = { fg = "#CB813C", bg = "#6b441f" }
progress_error = { fg = "#2c1c0d", bg = "#f38ba8" }

[which]
border = { fg = "#3a3331" }
cols = 3
mask = { bg = "#392a1d" }
cand = { fg = "#CB813C", bold = true }
rest = { fg = "#94a1b2" }
desc = { fg = "#5a5757", italic = true }
separator_style = { fg = "#3a3331" }

[confirm]
border = { fg = "#3a3331" }
title = { fg = "#CB813C", bold = true }
body = { fg = "#eef2f7" }
list = { fg = "#94a1b2" }
btn_yes = { fg = "#11111b", bg = "#CB813C", bold = true }
btn_no = { fg = "#94a1b2", bg = "#392a1d" }

[spot]
border = { fg = "#3a3331" }
title = { fg = "#CB813C", bold = true }
tbl_col = { fg = "#94a1b2" }
tbl_cell = { bg = "#392a1d" }

[notify]
title_info = { fg = "#89b4fa" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[pick]
border = { fg = "#3a3331" }
active = { fg = "#CB813C", bold = true }
inactive = { fg = "#94a1b2" }

[input]
border = { fg = "#3a3331" }
title = { fg = "#CB813C", bold = true }
value = { fg = "#eef2f7" }
selected = { bg = "#392a1d" }

[cmp]
border = { fg = "#3a3331" }
active = { fg = "#eef2f7", bg = "#392a1d" }
inactive = { fg = "#94a1b2" }

[tasks]
border = { fg = "#3a3331" }
title = { fg = "#CB813C", bold = true }
hovered = { fg = "#CB813C", bold = true }

[help]
border = { fg = "#3a3331" }
chord = { fg = "#CB813C" }
action = { fg = "#eef2f7" }
hovered = { bg = "#392a1d", bold = true }

# The mime patterns are yazi's own shape — `**/` and a brace list — and
# not the bare `image/*` an older flavour would use, which matches
# nothing here and says nothing about it.
[filetype]
rules = [
  { mime = "**/image/*", fg = "#f8ad67" },
  { mime = "**/{audio,video}/*", fg = "#f9e2af" },
  { mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#f6abc0" },
  { mime = "**/application/{pdf,doc,rtf}", fg = "#9cc0fa" },

  { mime = "vfs/{absent,stale}", fg = "#5a5757", crossed = true },
  { url = "*", is = "orphan", fg = "#5a5757", crossed = true },
  { url = "*", is = "dummy", fg = "#5a5757", crossed = true },
  { url = "*/", is = "dummy", fg = "#5a5757", crossed = true },
  { url = "*", is = "exec", fg = "#a6e3a1" },

  { url = "*", fg = "#b7c0cb" },
  { url = "*/", fg = "#eef2f7" }
]
